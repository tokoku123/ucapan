<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 85%;
        }
        h1 { color: #ff6b6b; display: none; margin-top: 0;}
        p { color: #555; font-size: 18px; line-height: 1.6; display: none; }
        .kado {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s;
            margin: 20px 0;
        }
        .kado:hover { transform: scale(1.1) rotate(5deg); }
        .kado.opened { display: none; }
        .instruksi { color: #888; font-size: 14px; margin-top: 10px; font-weight: bold;}
    </style>
    <!-- Script untuk efek kertas warna-warni (confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Tampilan Awal -->
        <div class="kado" id="kado">🎁</div>
        <div class="instruksi" id="instruksi">Klik kado ini!</div>
        
        <!-- Ucapan yang akan muncul setelah kado diklik -->
        <h1 id="judul">Selamat Ulang Tahun! 🎉</h1>
        <p id="pesan">
            Selamat ulang tahun, <b>Khoirunnisa Zerlinda Mevani</b><br><br>
            Semoga panjang umur, sehat selalu, dan semua yang kamu cita-citakan bisa tercapai tahun ini. Bahagia selalu ya! 🎂✨
        </p>
    </div>

    <script>
        document.getElementById('kado').addEventListener('click', function() {
            // Sembunyikan kado
            this.classList.add('opened');
            document.getElementById('instruksi').style.display = 'none';
            
            // Tampilkan ucapan
            document.getElementById('judul').style.display = 'block';
            document.getElementById('pesan').style.display = 'block';
            
            // Nyalakan animasi confetti
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
